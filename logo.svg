<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">الشعار الموحد لمنظومة دار الارتقاء الفكري التعليمية</title>
<desc id="desc">يد تحمل ريشة ترمز إلى المعرفة والكتابة، ضمن أقواس زرقاء وكحلية، مع الهوية الموحدة لمنظومة دار الارتقاء الفكري التعليمية.</desc>
