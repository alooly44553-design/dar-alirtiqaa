<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
<title id="title">الشعار الرسمي لمنظومة مدارس ومراكز دار الارتقاء الفكري التعليمية</title>
<desc id="desc">كتاب مفتوح ويد تحمل ريشة زرقاء وذهبية، وتحتها اسم المنظومة وعبارة لتعليم الجاليات، والفئات المستهدفة، والمجالات التعليمية السبعة بالترتيب المعتمد.</desc>
<defs>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#159de4"/><stop offset=".52" stop-color="#0864ba"/><stop offset="1" stop-color="#05285b"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff09b"/><stop offset=".48" stop-color="#f1bb36"/><stop offset="1" stop-color="#9c6414"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff1d1"/><stop offset=".6" stop-color="#ffd18a"/><stop offset="1" stop-color="#c98743"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#00345f" flood-opacity=".5"/></filter>
</defs>
<rect width="1200" height="1260" fill="#000"/>
<!-- gold halo -->
<path d="M270 520 A330 300 0 1 1 930 520" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
<!-- open book -->
<g filter="url(#shadow)">
 <path d="M105 570 Q310 495 600 616 Q885 495 1095 570 L1068 683 Q830 635 600 720 Q365 635 132 683Z" fill="url(#blue)" stroke="#061d45" stroke-width="5" stroke-linejoin="round"/>
 <path d="M132 578 Q337 526 596 631 L600 679 Q365 589 113 650Z" fill="url(#gold)"/>
 <path d="M1068 578 Q863 526 604 631 L600 679 Q835 589 1087 650Z" fill="url(#gold)"/>
 <path d="M110 640 Q365 576 600 687 Q835 576 1090 640" fill="none" stroke="#159de4" stroke-width="12" stroke-linecap="round"/>
 <!-- blue sleeve, gold cuff -->
 <path d="M330 469 L415 505 L375 600 L286 555Z" fill="url(#blue)" stroke="#062e63" stroke-width="5"/>
 <path d="M318 481 L397 513 L384 538 L306 505Z" fill="url(#gold)"/>
 <!-- hand -->
 <path d="M354 465 C382 428 425 405 467 418 C507 430 542 435 580 429 L661 405 C690 397 705 414 692 436 C682 452 655 466 628 478 L697 447 C719 438 737 455 719 476 L674 508 L711 490 C734 479 750 501 726 523 L671 565 C638 589 599 601 560 587 L496 566 C462 555 426 547 394 558 C372 551 370 499 354 465Z" fill="url(#skin)" stroke="#bd7e43" stroke-width="4" stroke-linejoin="round"/>
 <path d="M415 463 Q450 446 482 462 M498 483 Q541 491 574 480 M587 514 L637 489" fill="none" stroke="#fff4d9" stroke-width="6" stroke-linecap="round"/>
 <!-- feather -->
 <path d="M567 495 C596 404 644 270 801 106 C830 76 858 52 887 36 C891 160 834 278 750 355 C689 411 626 470 567 495Z" fill="url(#blue)" stroke="#062d63" stroke-width="4" stroke-linejoin="round"/>
 <path d="M821 92 C850 60 873 43 887 36 C883 104 856 164 825 211 L787 238 C826 167 838 117 821 92Z" fill="url(#gold)"/>
 <path d="M581 488 C646 375 732 237 873 51" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
 <path d="M660 385 L749 352 M693 326 L773 290 M728 268 L793 230 M759 214 L822 174 M792 158 L851 119" fill="none" stroke="#55b9fb" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- name and approved wording -->
<g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" direction="rtl">
 <text x="600" y="785" fill="#087ee0" font-size="54" font-weight="900">منظومة مدارس ومراكز</text>
 <text x="600" y="850" fill="#087ee0" font-size="58" font-weight="900">دار الارتقاء الفكري التعليمية</text>
 <text x="600" y="925" fill="url(#gold)" font-size="51" font-weight="900">لتعليم الجاليات</text>
 <text x="600" y="983" fill="#1688e8" font-size="31" font-weight="800">اليمنية - السورية - الإفريقية - جميع الدول العربية والإسلامية</text>
 <text x="600" y="1054" fill="#ffffff" font-size="24" font-weight="800">الطفولة والتأسيس  •  التعليم الأساسي والعام  •  التعليم الجامعي والعالي  •  التدريب المهني والتقني</text>
 <text x="600" y="1114" fill="#ffffff" font-size="26" font-weight="800">القرآن والإسلامية  •  التقوية والعربية والتأهيل  •  الإرشاد الأكاديمي</text>
 
</g>
</svg>