<path d="M505 55V375" stroke="#d7e7f7" stroke-width="3"/>
<g font-family="Tahoma, Arial, sans-serif" text-anchor="end" direction="rtl">
 <text x="1150" y="88" fill="#0d5c91" font-size="35" font-weight="800">منظومة مدارس ومراكز</text>
 <text x="1150" y="157" fill="url(#deep)" font-size="49" font-weight="900">دار الارتقاء الفكري التعليمية</text>
 <text x="1150" y="213" fill="#0d5c91" font-size="30" font-weight="800">لتعليم الجاليات • التعليم عن بُعد</text>
 <path d="M625 244H1150" stroke="#c89b2c" stroke-width="4" stroke-linecap="round"/>
 <text x="1150" y="291" fill="#082f57" font-size="23" font-weight="800">الطفولة والتأسيس • التعليم الأساسي والعام</text>
 <text x="1150" y="330" fill="#0d5c91" font-size="22" font-weight="700">الجامعي • المهني والتقني • القرآن والإسلامية</text>
 <text x="1150" y="369" fill="#082f57" font-size="22" font-weight="700">التقوية والتأهيل • الإرشاد الأكاديمي • ومجالات أخرى</text>
