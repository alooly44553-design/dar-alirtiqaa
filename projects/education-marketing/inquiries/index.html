<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الردود والاستفسارات</title><style>body{font-family:Tahoma;background:#f3f6fa;margin:0;line-height:1.7}header{background:#082f57;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;font:inherit}button,a{background:#0d5c91;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}</style><header><h1>مركز الردود والاستفسارات</h1><p>تصنيف الرسائل وإعداد ردود مقترحة باللغات واللهجات.</p><a href="../index.html">العودة إلى لوحة الأعمال</a></header><main><div class="box">هذه واجهة تجريبية مستقلة. لا يوجد استقبال مباشر للرسائل أو إرسال تلقائي. يجب أن يوضح المساعد للجمهور أنه مساعد ذكي.</div><div class="box"><form id="f"><label>نص الاستفسار</label><textarea id="q" required></textarea><label>الرد المقترح</label><textarea id="reply" required></textarea><button>إضافة سجل مؤقت</button></form><ul id="list"></ul></div></main><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent=document.getElementById('q').value+' — الرد المقترح: '+document.getElementById('reply').value;document.getElementById('list').prepend(li);this.reset()})</script></html>
