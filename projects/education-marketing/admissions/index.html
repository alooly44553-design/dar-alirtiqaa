<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القبول والتسجيل التعليمي</title><style>body{font-family:Tahoma;background:#f3f6fa;margin:0;line-height:1.7}header{background:#082f57;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;font:inherit}button,a{background:#0d5c91;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}</style><header><h1>القبول والتسجيل التعليمي</h1><p>توجيه المستفيدين إلى إجراءات التسجيل التعليمية الرسمية.</p><a href="../index.html">العودة إلى لوحة الأعمال</a></header><main><div class="box">استلام الاستفسار لا يعني القبول. لا تجمع بيانات الأطفال أو وثائقهم هنا؛ استخدم نموذج التسجيل الرسمي الآمن. هذه الواجهة لا تحفظ البيانات في قاعدة دائمة.</div><div class="box"><form id="f"><label>نوع الاستفسار</label><input id="q" required><label>المسار التعليمي</label><input id="track" required><label>ملاحظات عامة غير حساسة</label><textarea id="notes"></textarea><button>إضافة سجل مؤقت</button></form><ul id="list"></ul></div></main><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent=document.getElementById('q').value+' — '+document.getElementById('track').value+' — '+document.getElementById('notes').value;document.getElementById('list').prepend(li);this.reset()})</script></html>
