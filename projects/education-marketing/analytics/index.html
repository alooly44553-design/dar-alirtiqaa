<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحليلات والتقارير</title><style>body{font-family:Tahoma;background:#f3f6fa;margin:0;line-height:1.7}header{background:#082f57;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;font:inherit}button,a{background:#0d5c91;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}</style><header><h1>التحليلات والتقارير</h1><p>تسجيل مؤشرات الأداء وملاحظات التحسين للحملات التعليمية.</p><a href="../index.html">العودة إلى لوحة الأعمال</a></header><main><div class="box">لا توجد بيانات حية من الشبكات في هذه النسخة. لا تعرض هذه الصفحة أرقام وصول أو تفاعل مختلقة؛ سجّل فقط أرقامًا موثقة يدويًا بعد جمعها من المصدر الرسمي.</div><div class="box"><form id="f"><label>اسم الحملة أو القناة</label><input id="campaign" required><label>المؤشر والرقم الموثق</label><input id="metric" required placeholder="مثال: عدد النقرات من لوحة المنصة"><label>مصدر الرقم وتاريخ القياس</label><textarea id="source" required></textarea><button>إضافة قياس مؤقت</button></form><ul id="list"></ul></div><section class="box"><h2>المهام والجدول والسجل والطواقم</h2><form id="wb"><label>المهمة</label><input id="wbt" required><label>الموعد</label><input id="wbd" type="datetime-local"><label>ملاحظة أو سجل</label><textarea id="wbl"></textarea><label>الدور المسؤول</label><input id="wbr"><button>إضافة سجل مؤقت</button></form><ul id="wbo"></ul></section><script>document.getElementById('wb').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent='المهمة: '+document.getElementById('wbt').value+' | الموعد: '+document.getElementById('wbd').value+' | السجل: '+document.getElementById('wbl').value+' | الدور: '+document.getElementById('wbr').value;document.getElementById('wbo').prepend(li);this.reset()})</script></main><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent=document.getElementById('campaign').value+' — '+document.getElementById('metric').value+' — '+document.getElementById('source').value;document.getElementById('list').prepend(li);this.reset()})</script></html>
