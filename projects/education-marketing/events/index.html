<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفعاليات والأنشطة</title><style>body{font-family:Tahoma;background:#f3f6fa;margin:0;line-height:1.7}header{background:#082f57;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;font:inherit}button,a{background:#0d5c91;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}</style><header><h1>الفعاليات والأنشطة</h1><p>تخطيط المبادرات والمسابقات والأنشطة التعليمية.</p><a href="../index.html">العودة إلى لوحة الأعمال</a></header><main><div class="box">هذه قائمة تخطيط مؤقتة وليست تقويمًا مشتركًا أو دعوة منشورة. تأكد من اعتماد التاريخ والموقع قبل الإعلان.</div><div class="box"><form id="f"><label>اسم الفعالية</label><input id="event" required><label>التاريخ المقترح</label><input id="date" type="date"><label>وصف النشاط</label><textarea id="desc"></textarea><button>إضافة فعالية مؤقتة</button></form><ul id="list"></ul></div></main><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent=document.getElementById('event').value+' — '+document.getElementById('date').value+' — '+document.getElementById('desc').value;document.getElementById('list').prepend(li);this.reset()})</script></html>
