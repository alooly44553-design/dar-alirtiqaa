<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطواقم والموارد الإعلامية</title><style>body{font-family:Tahoma;background:#f3f6fa;margin:0;line-height:1.7}header{background:#082f57;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;font:inherit}button,a{background:#0d5c91;color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none}</style><header><h1>الطواقم والموارد الإعلامية</h1><p>تحديد الأدوار والمسؤوليات والموارد الخاصة بالتسويق التعليمي.</p><a href="../index.html">العودة إلى لوحة الأعمال</a></header><main><div class="box">سجّل الأدوار والمسؤوليات العامة فقط. هذه القائمة مؤقتة ولا تمثل صلاحيات دخول فعلية أو طاقمًا تم تعيينه.</div><div class="box"><form id="f"><label>الدور</label><input id="role" required><label>المسؤوليات</label><textarea id="responsibilities" required></textarea><label>الموارد المطلوبة</label><textarea id="resources"></textarea><button>إضافة دور مؤقت</button></form><ul id="list"></ul></div><section class="box"><h2>المهام والجدول والسجل والطواقم</h2><form id="wb"><label>المهمة</label><input id="wbt" required><label>الموعد</label><input id="wbd" type="datetime-local"><label>ملاحظة أو سجل</label><textarea id="wbl"></textarea><label>الدور المسؤول</label><input id="wbr"><button>إضافة سجل مؤقت</button></form><ul id="wbo"></ul></section><script>document.getElementById('wb').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent='المهمة: '+document.getElementById('wbt').value+' | الموعد: '+document.getElementById('wbd').value+' | السجل: '+document.getElementById('wbl').value+' | الدور: '+document.getElementById('wbr').value;document.getElementById('wbo').prepend(li);this.reset()})</script></main><script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const li=document.createElement('li');li.textContent=document.getElementById('role').value+' — '+document.getElementById('responsibilities').value+' — '+document.getElementById('resources').value;document.getElementById('list').prepend(li);this.reset()})</script></html>
