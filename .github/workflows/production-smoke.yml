name: Production readiness smoke checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production pages and read-only service checks
        env:
          PRODUCTION_BASE_URL: https://alirtiqaa-educational-platform.vercel.app
        run: node tests/production-smoke.mjs
