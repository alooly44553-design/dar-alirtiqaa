name: Deploy Dar Al-Irtiqaa to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK for permanent Pages download
        shell: bash
        run: |
          set -e
          APP_VERSION="$(node -p "require('./package.json').version")"
          IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          mkdir -p www
          cp *.html app.webmanifest logo.svg icon.svg sw.js www/
          for dir in ads assets lib projects; do
            if [ -d "$dir" ]; then cp -R "$dir" www/; fi
          done
          npx cap add android
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 48 -h 48 icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk "downloads/dar-alirtiqaa-$APP_VERSION-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/dar-alirtiqaa.apk
          sha256sum "downloads/dar-alirtiqaa-$APP_VERSION-debug.apk" > "downloads/dar-alirtiqaa-$APP_VERSION-debug.apk.sha256"

      - name: Prepare minimal public Pages directory
        shell: bash
        run: |
          set -e
          mkdir -p site/downloads
          cp *.html app.webmanifest logo.svg icon.svg sw.js site/
          for dir in ads assets lib projects; do
            if [ -d "$dir" ]; then cp -R "$dir" site/; fi
          done
          cp downloads/dar-alirtiqaa.apk "downloads/dar-alirtiqaa-$APP_VERSION-debug.apk" "downloads/dar-alirtiqaa-$APP_VERSION-debug.apk.sha256" site/downloads/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
