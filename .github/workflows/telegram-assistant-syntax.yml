name: Telegram assistant syntax checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check api/telegram.js && node --check lib/telegram-assistant.js
