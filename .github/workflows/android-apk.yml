name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prepare web bundle
        run: mkdir -p www && cp *.html app.webmanifest logo.svg icon.svg sw.js www/ && mkdir -p www/ads && cp ads/*.svg www/ads/
      - name: Create Android project
        run: npx cap add android
      - name: Apply app identity and version
        shell: bash
        run: |
          set -e
          sed -i 's/versionCode [0-9]*/versionCode 10/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.1.6"/' android/app/build.gradle
      - name: Install official launcher logo
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 48 -h 48 icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: dar-alirtiqaa-debug-apk-v1.1.6
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
