name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prepare web bundle
        run: mkdir -p www && cp *.html app.webmanifest logo.svg icon.svg sw.js www/ && mkdir -p www/ads && cp ads/*.svg www/ads/
      - name: Create Android project
        run: npx cap add android
      - name: Apply app identity and version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json must use a stable semantic version such as 1.1.7."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE <= 0 || VERSION_CODE > 2100000000 )); then
            echo "::error::Calculated Android versionCode is out of range."
            exit 1
          fi
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$APP_VERSION\"/" android/app/build.gradle
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Install official launcher logo
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          rsvg-convert -w 48 -h 48 icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build stable Release APK when all signing secrets are configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dar-alirtiqaa-release.jks
          ./gradlew assembleRelease
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks dar-alirtiqaa-release.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --out app-release-signed.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app-release-signed.apk
          rm -f dar-alirtiqaa-release.jks app-release-aligned.apk
      - name: Upload signed Android release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dar-alirtiqaa-android-release-v${{ env.APP_VERSION }}
          path: android/app-release-signed.apk
          if-no-files-found: error
      - name: Upload Debug APK (testing only)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dar-alirtiqaa-android-debug-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
