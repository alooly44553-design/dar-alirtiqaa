<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">التوجيه والقبول الجامعي والدراسات العليا</title><desc id="d">ملصق تعريفي لخدمة التوجيه الجامعي بدار الإرتقاء الفكري العالمية</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061f3a"/><stop offset=".58" stop-color="#0d477c"/><stop offset="1" stop-color="#0f7b83"/></linearGradient><linearGradient id="g"><stop stop-color="#f5d879"/><stop offset="1" stop-color="#c89b2c"/></linearGradient></defs><rect width="1080" height="1350" rx="30" fill="url(#b)"/><path d="M0 0H1080V24Q540 90 0 24Z" fill="url(#g)"/><image href="../logo.svg" x="60" y="55" width="430" height="210" preserveAspectRatio="xMidYMid meet"/><g font-family="Tahoma,Arial,sans-serif" direction="rtl" text-anchor="end"><text x="1010" y="110" fill="#f5d879" font-size="25" font-weight="800">مبادرة تعليمية عالمية</text><text x="1010" y="165" fill="#fff" font-size="26" font-weight="700">للجاليات العربية والإسلامية</text><text x="1010" y="360" fill="#fff" font-size="54" font-weight="900">التوجيه والقبول الجامعي</text><text x="1010" y="430" fill="#f5d879" font-size="48" font-weight="900">والدراسات العليا</text><text x="1010" y="510" fill="#e4f1fc" font-size="26">ابدأ بطلب التوجيه واستكشف الخيارات المناسبة لمؤهلك.</text><text x="1010" y="560" fill="#c5d8e8" font-size="22">استقبال طلبات الاهتمام والاستفسار الأولي.</text><text x="1010" y="680" fill="#f5d879" font-size="25" font-weight="800">المراحل المستهدفة للاستفسار</text><text x="1010" y="735" fill="#fff" font-size="23">الدبلوم • البكالوريوس • الدبلوم العالي • الماجستير</text><text x="1010" y="780" fill="#fff" font-size="23">والدراسات العليا بحسب البرامج التي يُتحقق من توفرها</text></g><rect x="70" y="850" width="940" height="150" rx="20" fill="#ffffff12" stroke="#ffffff35"/><g font-family="Tahoma,Arial,sans-serif" direction="rtl" text-anchor="end"><text x="970" y="895" fill="#f5d879" font-size="24" font-weight="800">تنويه مهم</text><text x="970" y="940" fill="#fff" font-size="20">طلب التوجيه لا يعني القبول النهائي أو ضمان الحصول على مؤهل.</text><text x="970" y="975" fill="#fff" font-size="20">تُعلن البرامج بعد التحقق من توفرها واعتمادها.</text></g><a href="https://alirtiqaa-educational-platform.vercel.app/higher-education.html"><rect x="250" y="1040" width="580" height="82" rx="20" fill="url(#g)"/><text x="540" y="1093" text-anchor="middle" fill="#082f57" font-family="Tahoma,Arial,sans-serif" font-size="28" font-weight="900">ابدأ طلب التوجيه الجامعي</text></a><text x="540" y="1170" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19">alirtiqaa-educational-platform.vercel.app/higher-education.html</text><text x="540" y="1240" text-anchor="middle" fill="#f5d879" font-family="Tahoma,Arial,sans-serif" font-size="22">العلم للجميع • والطموح بلا حدود</text><text x="540" y="1290" text-anchor="middle" fill="#c5d8e8" font-family="Tahoma,Arial,sans-serif" font-size="17">تحقق من البرامج وشروطها والجهة المانحة قبل أي التزام مالي.</text></svg>